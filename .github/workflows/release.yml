name: release

# A pushed tag v* builds the universal app and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel  # arm64 macOS runners were unavailable for hours (2026-11-17); the build is universal anyway
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        # The Control Center widget needs the macOS 26 SDK; the runner's default Xcode is 16.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build.noindex/MicLock.app "MicLock-${GITHUB_REF_NAME}.zip"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MicLock-${GITHUB_REF_NAME}.zip" --title "MicLock $GITHUB_REF_NAME" --generate-notes
      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v5
        with:
          name: MicLock
          path: MicLock-*.zip
